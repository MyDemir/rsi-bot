# ── RSI botu — Fly.io yapılandırması ───────────────────────────────────────
#
# 'app' adı Fly genelinde benzersiz olmalı — ilk kurulumda değiştir (örn. "rsi-bot-musteri").
#
# primary_region mutlaka fra ya da ams: Binance Futures API ABD IP'lerini (iad, ord, sea…) 451 ile engeller.
#
# Bot arka plan worker'ı (Binance WebSocket + REST + Telegram long polling) — HTTP servisi yok, bu yüzden [http_service] bloğu YOK.
# O blok olursa Fly makineyi "trafik yok" diye uyutmaya çalışır.

app = "rsi-bot"
primary_region = "fra"

# Kapanışta Telegram kuyruğu boşaltılır (en fazla 5 sn); Fly varsayılanı 5 sn olduğu için pay bırakıldı
kill_signal  = "SIGINT"
kill_timeout = 15

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"

# Kalıcı disk — ayarlar (eşikler vb.) deploy/yeniden başlatma sonrası korunur
[mounts]
  source      = "rsi_data"
  destination = "/data"

# Bot ~120 MB kullanır; grafik çizimi (canvas) için pay bırakıldı
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
